name: Notify Google Chat on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Google Chat notification
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REVIEWER_MAP: ${{ vars.REVIEWER_ID_MAP }}
        run: |
          echo "DEBUG - REVIEWER_MAP contents:"
          echo "$REVIEWER_MAP"
          echo "---"

          # Get current hour in Philippines time (adjust TZ if your team is elsewhere)
          HOUR=$(TZ="Asia/Manila" date +%H)

          if [ "$HOUR" -lt 12 ]; then
            TIME_GREETING="Good morning"
          elif [ "$HOUR" -lt 18 ]; then
            TIME_GREETING="Good afternoon"
          else
            TIME_GREETING="Good evening"
          fi

          # Extract everything under "Reviewer(s)" heading until the next "## " heading
          REVIEWERS_SECTION=$(printf '%s' "$PR_BODY" | awk '/Reviewer\(s\)/{flag=1; next} /^## /{flag=0} flag')

          # Match GitHub @usernames in that section against REVIEWER_ID_MAP keys
          MENTIONS=""
          for key in $(echo "$REVIEWER_MAP" | jq -r 'keys[]'); do
            if echo "$REVIEWERS_SECTION" | grep -qiE "@${key}\b"; then
              email=$(echo "$REVIEWER_MAP" | jq -r --arg k "$key" '.[$k]')
              MENTIONS="$MENTIONS @${email}"
            fi
          done
          # Remove duplicate emails (same person may be listed under multiple keys)
          MENTIONS=$(echo "$MENTIONS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//; s/ *$//')

          if [ -z "$MENTIONS" ]; then
            GREETING="${TIME_GREETING} Tadiran Team! 🌸
          ⚠️ No matching reviewers found — please check the Reviewer(s) section of the PR."
          else
            GREETING="${TIME_GREETING} Tadiran Team! 🌸
          Hi $MENTIONS — PR's all ready and waiting for some feedback from you guys 🙈"
          fi

          MESSAGE="$GREETING

          📌 *Title:* ${PR_TITLE}
          👤 *Author:* ${PR_AUTHOR}
          🌿 *Branch:* \`${PR_HEAD}\` → \`${PR_BASE}\`

          🔗 ${PR_URL}

          Would appreciate your eyes on it whenever you get a chance 🥹🙏 Thank youuu! 💛"

          JSON_PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          curl -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
