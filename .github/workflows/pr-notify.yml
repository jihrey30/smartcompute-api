name: Notify Google Chat on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  notify:
    if: github.event.pull_request.user.login == vars.TARGET_PR_USER
    runs-on: ubuntu-latest
    steps:
      - name: Send Google Chat notification
        run: |
          curl -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🔔 New PR: *${{ github.event.pull_request.title }}*\nBy: ${{ github.event.pull_request.user.login }}\n${{ github.event.pull_request.html_url }}"
            }'
