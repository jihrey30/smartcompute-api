name: Notify Google Chat on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Google Chat notification
        run: |
          curl -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🔔 *New Pull Request*\n\n📌 *Title:* ${{ github.event.pull_request.title }}\n👤 *Author:* ${{ github.event.pull_request.user.login }}\n🌿 *Branch:* `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`\n\n${{ github.event.pull_request.body }}\n\n🔗 ${{ github.event.pull_request.html_url }}\n\nWould appreciate your eyes on it whenever you get a chance 🙏"
            }'
