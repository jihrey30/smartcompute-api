name: Notify Google Chat on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    if: github.event.pull_request.user.login == 'jihrey30'
    runs-on: ubuntu-latest
    steps:
      - name: Send Google Chat notification
        run: |
          curl -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "Hi team 🌸\nPR'\''s all ready and waiting for some feedback from you guys 🙈\n\n🔀 PR by *${{ github.event.pull_request.user.login }}*: ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}\n\nWould appreciate your eyes on it whenever you get a chance 🥹🙏 Thank youuu! 💛"
            }'
